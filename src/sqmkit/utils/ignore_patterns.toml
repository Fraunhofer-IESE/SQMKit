# Shared ignore patterns for repository traversal; patterns use gitignore syntax, and each tool reads the [common] section plus its own section so common entries (VCS metadata, dependencies, build output, caches) are defined once.

[common]
patterns = [
  ".git/",
  ".hg/",
  ".svn/",
  ".venv/",
  "venv/",
  "node_modules/",
  "__pycache__/",
  ".mypy_cache/",
  ".pytest_cache/",
  ".ruff_cache/",
  ".tox/",
  ".nox/",
  "htmlcov/",
  "dist/",
  "build/",
  "target/",
  "vendor/",
  "out/",
  "coverage/",
  ".cache/",
  "*.egg-info/",
  ".idea/",
  ".vscode/",
]

[reuse]
patterns = [
  # Images, audio & video files
  "*.png",
  "*.jpg",
  "*.jpeg",
  "*.gif",
  "*.svg",
  "*.ico",
  "*.webp",
  "*.bmp",
  "*.tif",
  "*.tiff",
  "*.avif",
  "*.heic",
  "*.heif",
  "*.mp4",
  "*.mp3",
  "*.ogg",
  "*.wav",
  "*.webm",
  "*.mov",
  "*.m4v",
  "*.m4a",
  "*.mkv",
  "*.avi",
  "*.flac",
  "*.aac",
  "*.opus",

  # Document & office files
  "*.pdf",
  "*.doc",
  "*.docx",
  "*.docm",
  "*.dotx",
  "*.ppt",
  "*.pptx",
  "*.pptm",
  "*.xls",
  "*.odt",
  "*.ods",
  "*.odp",
  "*.xlsx",
  "*.xlsm",
  "*.xlsb",
  "*.epub",

  # Documentation & plain-text files
  "*.md",
  "*.markdown",
  "*.rst",
  "*.adoc",
  "*.txt",
  "*.html",
  "*.xml",
  "AUTHORS",
  "CHANGELOG",
  "VERSION",

  # Configuration, structured data & generated metadata files
  "*.yml",
  "*.yaml",
  "*.env",
  "*.env.*",
  "*.work",
  "*.json",
  "*.jsonl",
  "*.csv",
  "*.tsv",
  "*.snap",
  "*.ipynb",
  "Dockerfile",
  "Dockerfile.*",

  # Build & project configuration files
  "*.toml",
  "*.ini",
  "*.cfg",

  # Dependency lock & checksum files
  "*.lock",
  "*.lockfile",
  "*.resolved",
  "*.sum",

  # Certificates & certificate bundles
  "*.pem",
  "*.crt",
  "*.ca-bundle",
  "*.der",
  "*.cer",
  "*.pfx",
  "*.p12",

  # Java keystore files
  "*.jks",

  # GPG & PGP files
  "*.gpg",
  "*.asc",
  "*.pgp",

  # Repository metadata files
  ".gitignore",
  ".gitmodules",
  ".gitattributes",
  ".dockerignore",
  ".editorconfig",

  # Font files
  "*.ttf",
  "*.otf",
  "*.woff",
  "*.woff2",
  "*.eot",

  # Archives & packaged artifacts
  "*.zip",
  "*.tar",
  "*.gz",
  "*.bz2",
  "*.xz",
  "*.rar",
  "*.7z",
  "*.tgz",
  "*.zst",
  "*.lz4",
  "*.cab",
  "*.iso",
  "*.jar",
  "*.war",
  "*.ear",
  "*.whl",
  "*.deb",
  "*.rpm",
  "*.apk",

  # Compiled & native binary files
  "*.exe",
  "*.dll",
  "*.so",
  "*.dylib",
  "*.class",
  "*.o",
  "*.obj",
  "*.a",
  "*.lib",
  "*.pdb",
  "*.bin",
  "*.pyc",
  "*.pyo",
  "*.wasm",
  "*.dSYM/",
  "*.app/",

  # Generated & cache directories
  "migrations/",
  "generated/",
  "**/__pycache__/",

  # Logs, caches & temporary files
  "*.log",
  "*.tmp",
  "*.cache",

  # Operating-system metadata files
  ".DS_Store",
  "Thumbs.db",

  # Repository automation & agent directories
  ".github/",
  ".claude/",
  ".agents/",

  # Minified, bundled & source map files
  "*.min.js",
  "*.min.css",
  "*.bundle.js",
  "*.map",

  # Translation service configuration
  ".tx/",
]

[structure]
patterns = [
  ".git",
  "__pycache__",
  ".venv",
  "venv",
  "env",
  ".env",
  "dist",
  "build",
  "*.egg-info",
  ".mypy_cache",
  ".pytest_cache",
  ".ruff_cache",
  ".tox",
  ".nox",
  "htmlcov",
  ".coverage",
  "node_modules",
  ".npm",
  ".yarn",
  ".pnp",
  "bower_components",
  ".next",
  ".nuxt",
  ".svelte-kit",
  ".turbo",
  ".parcel-cache",
  ".cache",
  "out",
  "target",
  ".gradle",
  ".mvn",
  "gradle",
  "bin",
  "obj",
  ".vs",
  "packages",
  ".cargo",
  "vendor",
  ".bundle",
  "vendor/bundle",
  ".idea",
  ".vscode",
  ".eclipse",
  ".settings",
  "*.swp",
  ".DS_Store",
  "Thumbs.db",
  ".terraform",
  ".vagrant",
  ".serverless",
]

[lizard]
patterns = [
  "*/.venv/*",
  "*/venv/*",
  "*/__pycache__/*",
  "*/.mypy_cache/*",
  "*/.pytest_cache/*",
  "*/.ruff_cache/*",
  "*/.tox/*",
  "*/.nox/*",
  "*/.cache/*",
  "*/node_modules/*",
  "*/public/*",
  "*/vendor/*",
  "*/target/*",
  "*/generated/*",
  "*/.git/*",
  "*/.github/*",
  "*/dist/*",
  "*/build/*",
  "*/out/*",
  "*/coverage/*",
  "*/.vscode/*",
  "*/.idea/*",
  "*/docs/*",
  "*/doc/*",
  "*/documentation/*",
  "*/example/*",
  "*/examples/*",
  "*/samples/*",
  "*/fixtures/*",
  "*/test/*",
  "*/tests/*",
]
